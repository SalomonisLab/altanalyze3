<!doctype html>
<meta charset="utf-8">
<title>CITE-seq → flow: populations and virtual gates</title>
<style>
 :root{--bd:#d7dbe0;--bg:#fff;--ink:#1b1f24;--mut:#6b7280;--accent:#1f6feb;--head:#f6f8fa}
 *{box-sizing:border-box}
 body{margin:0;font:12.5px/1.45 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
 header{display:flex;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--bd);background:var(--head);flex-wrap:wrap}
 header b{font-size:13px;margin-right:4px}
 label.f{color:var(--mut)}
 select,button{font:inherit;padding:2px 5px;border:1px solid var(--bd);border-radius:4px;background:#fff;color:var(--ink)}
 button{cursor:pointer}
 button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
 #wrap{display:grid;grid-template-columns:300px 1fr 310px;height:calc(100vh - 44px)}
 .pane{overflow:auto;border-right:1px solid var(--bd);padding:8px}
 .pane:last-child{border-right:0;border-left:1px solid var(--bd)}
 h3{margin:10px 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
 #targetPanel select{max-width:100%;width:100%;margin:3px 0} #targetPanel button{margin:3px 2px} #targetPanel input{width:100%;padding:5px;border:1px solid var(--bd)} .notice{background:#fff8df;border:1px solid #e4d5a5;padding:7px;margin:7px 0} #optreport{overflow-wrap:anywhere} #plotbox{position:relative;padding:8px;display:flex;flex-direction:column;min-width:0}
 #cvwrap{position:relative;flex:1;min-height:0}
 canvas{position:absolute;inset:0;width:100%;height:100%}
 #ov{cursor:crosshair}
 .node{padding:1px 4px;border-radius:3px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .node:hover{background:#eef2f7}
 .node.sel{background:var(--accent);color:#fff}
 .node .n{color:var(--mut);font-variant-numeric:tabular-nums}
 .node.sel .n{color:#dbe9ff}
 table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
 td,th{padding:1px 4px;text-align:left}
 th{color:var(--mut);font-weight:600;border-bottom:1px solid var(--bd)}
 td.r,th.r{text-align:right}
 .hint{color:var(--mut);padding:2px 0}
 .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
 .bar{height:4px;background:var(--accent);border-radius:2px;display:inline-block;vertical-align:1px}
</style>
<header>
 <b>CITE-seq → flow</b>
 <label class="f">space <select id="space"></select></label>
 <label class="f">plot <select id="mode"><option value="biaxial">biaxial</option><option value="embedding">embedding</option></select></label>
 <span id="axsel"><label class="f">X <select id="xc"></select></label> <label class="f">Y <select id="yc"></select></label></span>
 <span id="embsel" hidden><label class="f">embedding <select id="emb"></select></label></span>
 <label class="f">colour <select id="col"></select></label>
 <label class="f">dot size <select id="dotSize" title="Dot width in pixels; applies to flow and embedding plots"><option value="auto">Auto</option><option value="1">1 px</option><option value="3">3 px</option><option value="5">5 px</option><option value="7">7 px</option></select></label>
 <span class="f">gate:</span>
 <button id="t_none" class="tool on" data-t="none">off</button>
 <button id="t_rect" class="tool" data-t="rect">rectangle</button>
 <button id="t_poly" class="tool" data-t="poly">polygon</button>
 <button id="t_ell" class="tool" data-t="ellipse">ellipse</button>
 <button id="t_quad" class="tool" data-t="quad">quadrant</button>
 <button id="clear">clear drawn gate</button><label class="f"><input type="checkbox" id="showSelection" checked>selection overlay</label><button id="clearSelection">clear selection</button>
 <span id="n" class="f"></span>
</header>
<div id="wrap">
 <div class="pane" id="left"></div>
 <div id="plotbox"><div id="cvwrap"><canvas id="cv"></canvas><canvas id="ov"></canvas></div>
   <div class="hint" id="axhint"></div></div>
 <div class="pane" id="right"></div>
</div>
<script>
const PAL=["#1f77b4","#d62728","#2ca02c","#ff7f0e","#9467bd","#8c564b","#e377c2","#17becf","#bcbd22","#7f7f7f",
 "#aec7e8","#ff9896","#98df8a","#ffbb78","#c5b0d5","#c49c94","#f7b6d2","#9edae5","#dbdb8d","#c7c7c7"];
// FlowJo-style pseudocolour ramp: low density blue -> high density red.
const DENS=[[40,60,160],[20,120,200],[20,180,170],[90,200,90],[220,210,60],[240,150,40],[220,50,40]];
const S={man:null,space:null,chan:{},lab:{},mask:{},active:null,poly:null,tool:"none",
         gatesets:{},overlay:null,drag:null,tf:null,highlight:null,gateHighlight:null,optimization:null,drawVersion:0,embCache:{}};
const bin=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(await r.text());return r.arrayBuffer();};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const q=await r.json();if(!r.ok)throw new Error(q.error||r.statusText);return q;}
const qs=()=>"?space="+encodeURIComponent(S.space);
const el=id=>document.getElementById(id);

async function boot(){
  el("dotSize").onchange=()=>draw();
  S.man=await (await fetch("/api/manifest")).json();
  S.gatesets=S.man.gatesets||{};
  fill("space",Object.keys(S.man.spaces));
  el("space").value=S.man.default_space; S.space=S.man.default_space;
  el("space").onchange=()=>{S.space=el("space").value;S.chan={};S.lab={};S.mask={};S.active=null;S.poly=null;S.highlight=null;S.gateHighlight=null;S.optimization=null;stats();loadSpace();};
  for(const b of document.querySelectorAll(".tool")) b.onclick=()=>{
    document.querySelectorAll(".tool").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");S.tool=b.dataset.t;S.poly=null;S.drag=null;draw();};
  el('showSelection').onchange=()=>draw();
  el('clearSelection').onclick=()=>{S.highlight=null;S.gateHighlight=null;S.optimization=null;S.poly=null;stats();draw();};
  el("clear").onclick=()=>{S.poly=null;S.drag=null;draw();stats();};
  el("mode").onchange=()=>{const e=el("mode").value==="embedding";
    el("embsel").hidden=!e;el("axsel").hidden=e;S.poly=null;draw();};
  for(const id of ["xc","yc","emb","col"]) el(id).onchange=()=>{S.poly=null;draw();};
  new ResizeObserver(()=>draw()).observe(el("cvwrap"));
  loadSpace();
}
function fill(id,xs,keep){const s=el(id),prev=s.value;s.innerHTML="";
  for(const x of xs){const o=document.createElement("option");o.value=x;o.textContent=x;s.appendChild(o);}
  if(keep&&xs.includes(prev))s.value=prev;}

function loadSpace(){
  const sp=S.man.spaces[S.space];
  fill("xc",sp.features);fill("yc",sp.features);
  el("xc").selectedIndex=0;el("yc").selectedIndex=Math.min(1,sp.features.length-1);
  const embs=Object.keys(sp.embeddings);
  fill("emb",embs);if(sp.default_embedding)el("emb").value=sp.default_embedding;
  const cols=["density"].concat(Object.keys(sp.labels)).concat(sp.features.map(f=>"marker:"+f));
  fill("col",cols,true);if(sp.default_label&&cols.includes(sp.default_label))el("col").value=sp.default_label;
  const hasEmb=embs.length>0;
  el("mode").value=hasEmb&&S.space!=="flow"?"embedding":el("mode").value;
  el("embsel").hidden=el("mode").value!=="embedding";el("axsel").hidden=!el("embsel").hidden;
  el("n").textContent=sp.n.toLocaleString()+(S.space==="flow"?" events":" cells");
  trees();draw();
}

/* ---------------- gate trees: the authors' strategy and the derived one -------------- */
function trees(){
  const L=el("left");const old=el("targetSet")?.value;L.innerHTML="";targetPanel(L,old);
  const sets=Object.entries(S.gatesets).filter(([k,g])=>(g.space||"flow")===S.space);
  if(!sets.length){const hint=document.createElement('div');hint.className='hint';hint.textContent='Draw a gate here, or select a population above to optimize its flow gate.';L.appendChild(hint);}
  for(const [name,g] of sets){
    const h=document.createElement("h3");
    h.textContent=(g.kind==="virtual"?"virtual gates — ":"FlowJo gates — ")+name;
    L.appendChild(h);
    if(g.workspace){const d=document.createElement("div");d.className="hint";
      d.textContent=g.workspace;L.appendChild(d);}
    for(const nd of g.nodes){
      const d=document.createElement("div");d.className="node";
      d.style.paddingLeft=(4+12*(nd.depth||0))+"px";
      const pct=nd.pct_of_parent!=null?nd.pct_of_parent.toFixed(1)+"%":"";
      d.innerHTML=`<span>${nd.name}</span> <span class="n">${(nd.n||0).toLocaleString()} · ${pct}</span>`;
      d.title=nd.path+"\n"+(nd.dims||"")+(nd.f1_vs_manual!=null?"\nF1 vs manual: "+nd.f1_vs_manual:"");
      d.onclick=()=>selectPop(name,nd,d);
      if(S.active&&S.active.gateset===name&&S.active.node.path===nd.path)d.classList.add("sel");
      L.appendChild(d);
    }
  }
  const cl=document.createElement("button");cl.textContent="show all events";
  cl.style.marginTop="8px";cl.onclick=()=>{S.active=null;trees();draw();stats();};
  L.appendChild(cl);
}
function childrenOf(setname,path){
  const g=S.gatesets[setname];if(!g)return[];
  return g.nodes.filter(x=>x.path!==path&&x.path.startsWith(path+"/")
    &&x.path.slice(path.length+1).indexOf("/")<0);
}
function parentOf(setname,path){
  if(path.indexOf("/")<0)return null;
  const pp=path.slice(0,path.lastIndexOf("/"));
  return (S.gatesets[setname].nodes.find(x=>x.path===pp))||null;
}
async function selectPop(setname,nd,node){
  document.querySelectorAll(".node").forEach(x=>x.classList.remove("sel"));
  node.classList.add("sel");
  node.scrollIntoView({block:"nearest"});
  const sp=S.man.spaces[S.space];
  const kids=childrenOf(setname,nd.path);
  // FlowJo behaviour: a gate is drawn on its PARENT's events. Selecting a population
  // therefore shows that population's events with its CHILDREN's gates on them; a
  // population with no children falls back to its parent's events carrying its own gate,
  // so the outline is always inside the plotted range instead of off-screen.
  let viewNode=nd, drawOn=kids.length?kids:[nd];
  if(!kids.length){viewNode=parentOf(setname,nd.path);}   // null = the ungated sample
  S.active={gateset:setname,node:nd,view:viewNode,show:drawOn.map(x=>x.path)};
  const ch=(drawOn[0].channels)||[];
  if(ch.length===2&&sp.features.includes(ch[0])&&sp.features.includes(ch[1])){
    el("mode").value="biaxial";el("embsel").hidden=true;el("axsel").hidden=false;
    el("xc").value=ch[0];el("yc").value=ch[1];
  }
  if(viewNode)await getMask(setname,viewNode.path);
  S.poly=null;draw();stats();
}
async function getMask(setname,path){
  const k=setname+"|"+path;
  if(!S.mask[k])S.mask[k]=new Uint8Array(await bin("/api/gatemask/"+encodeURIComponent(setname)+"/"+path.split("/").map(encodeURIComponent).join("/")));
  return S.mask[k];
}
/* parent of the active population, for FlowJo's "% of parent" and for drill-down */
function parentMask(){
  if(!S.active||!S.active.view)return null;    // a top-level gate is drawn on all events
  const k=S.active.gateset+"|"+S.active.view.path;
  return S.mask[k]||null;
}

/* ---------------- data ------------------------------------------------------------- */
async function getChan(n){const k=S.space+"|"+n;
  if(!S.chan[k])S.chan[k]=new Float32Array(await bin("/api/channel/"+encodeURIComponent(n)+qs()));
  return S.chan[k];}
async function getEmb(n){const k=S.space+"|"+n;if(!S.embCache[k])S.embCache[k]=new Float32Array(await bin("/api/embedding/"+encodeURIComponent(n)+qs()));return S.embCache[k];}
async function getLab(n){const k=S.space+"|"+n;
  if(!S.lab[k])S.lab[k]=new Int16Array(await bin("/api/labels/"+encodeURIComponent(n)+qs()));
  return S.lab[k];}

/* ---------------- drawing ---------------------------------------------------------- */
function pct(a,p){const s=Float64Array.from(a).sort();return s[Math.max(0,Math.min(s.length-1,Math.floor(p*(s.length-1))))];}
function range(v,idx){
  // FlowJo auto-scale: ignore the extreme tails so a handful of outliers cannot flatten the plot.
  const step=Math.max(1,Math.floor(idx.length/20000));const s=[];
  for(let i=0;i<idx.length;i+=step)s.push(v[idx[i]]);
  if(!s.length)return[0,1];
  s.sort((a,b)=>a-b);
  let lo=s[Math.floor(0.001*(s.length-1))],hi=s[Math.floor(0.999*(s.length-1))];
  if(!(hi>lo)){hi=lo+1;}
  const pad=(hi-lo)*0.04;return[lo-pad,hi+pad];
}
async function draw(){
  if(el('highlightTarget'))el('highlightTarget').textContent=S.highlight||S.gateHighlight?'Unhighlight cells':'Highlight cells';
  const version=++S.drawVersion;if(!S.man)return;
  const sp=S.man.spaces[S.space],N=sp.n,mode=el("mode").value;
  let xv,yv,xlab,ylab;
  if(mode==="embedding"){
    const name=el("emb").value;if(!name)return;
    const E=await getEmb(name);xv=new Float32Array(N);yv=new Float32Array(N);
    for(let i=0;i<N;i++){xv[i]=E[2*i];yv[i]=E[2*i+1];}
    xlab=name+" 1";ylab=name+" 2";
  }else{
    xlab=el("xc").value;ylab=el("yc").value;if(!xlab||!ylab)return;
    xv=await getChan(xlab);yv=await getChan(ylab);
  }
  if(version!==S.drawVersion)return;
  const pm=parentMask();
  const idx=[];for(let i=0;i<N;i++)if(!pm||pm[i])idx.push(i);
  const [x0,x1]=range(xv,idx),[y0,y1]=range(yv,idx);

  const wrap=el("cvwrap"),cv=el("cv"),ov=el("ov");
  const dpr=window.devicePixelRatio||1;
  const W=Math.max(50,Math.round(wrap.clientWidth)),H=Math.max(50,Math.round(wrap.clientHeight));
  for(const c of [cv,ov]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);
    c.style.width=W+"px";c.style.height=H+"px";}
  const M={l:58,r:14,t:10,b:42};
  const px=v=>M.l+(v-x0)/((x1-x0)||1)*(W-M.l-M.r);
  const py=v=>H-M.b-(v-y0)/((y1-y0)||1)*(H-M.t-M.b);
  S.tf={px,py,x0,x1,y0,y1,W,H,M,xlab,ylab,mode,
        ix:v=>x0+(v-M.l)/((W-M.l-M.r)||1)*(x1-x0),
        iy:v=>y0+(H-M.b-v)/((H-M.t-M.b)||1)*(y1-y0)};

  const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);g.fillStyle="#fff";g.fillRect(0,0,W,H);

  // colour source
  const col=el("col").value;let lab=null,vals=null,vlo=0,vhi=1;
  if(col.startsWith("marker:")){vals=await getChan(col.slice(7));
    const s=[];const st=Math.max(1,Math.floor(idx.length/20000));
    for(let i=0;i<idx.length;i+=st)s.push(vals[idx[i]]);s.sort((a,b)=>a-b);
    vlo=s[Math.floor(0.02*(s.length-1))];vhi=s[Math.floor(0.98*(s.length-1))];}
  else if(col!=="density")lab=await getLab(col);

  if(version!==S.drawVersion)return;
  // ---- points, written straight into an ImageData buffer (no per-point fillRect) ----
  const iw=Math.round(W*dpr),ih=Math.round(H*dpr);
  const img=g.getImageData(0,0,iw,ih),D=img.data;
  const GB=256,gx=new Int32Array(GB*GB);
  const bx=v=>Math.max(0,Math.min(GB-1,((v-x0)/((x1-x0)||1)*GB)|0));
  const by=v=>Math.max(0,Math.min(GB-1,((v-y0)/((y1-y0)||1)*GB)|0));
  for(const i of idx)gx[by(yv[i])*GB+bx(xv[i])]++;
  let dmax=0;for(let i=0;i<gx.length;i++)if(gx[i]>dmax)dmax=gx[i];
  const order=S.highlight||S.gateHighlight?idx.filter(i=>!S.highlight?.[i]&&!S.gateHighlight?.[i]).concat(idx.filter(i=>S.highlight?.[i]||S.gateHighlight?.[i])):idx;
  const dotSize=el("dotSize").value;
  const rad=dotSize==='auto'?(idx.length>40000?0:1):Math.max(0,Math.round((Number(dotSize)*dpr-1)/2));
  // Cache circular pixel footprints with softened edges for each dot radius.
  const footprints=new Map();
  const footprint=radius=>{
    if(!footprints.has(radius)){
      const pixels=[];
      for(let oy=-radius;oy<=radius;oy++)for(let ox=-radius;ox<=radius;ox++){
        const coverage=Math.max(0,Math.min(1,radius+1-Math.hypot(ox,oy)));
        if(coverage>0)pixels.push([ox,oy,coverage]);
      }
      footprints.set(radius,pixels);
    }
    return footprints.get(radius);
  };
  const put=(cx,cy,r,gg,b,a,radius=rad)=>{
    for(const [ox,oy,coverage] of footprint(radius)){
      const X=cx+ox,Y=cy+oy;if(X<0||Y<0||X>=iw||Y>=ih)continue;
      const o=4*(Y*iw+X);const al=a*coverage;
      D[o]=D[o]+(r-D[o])*al;D[o+1]=D[o+1]+(gg-D[o+1])*al;D[o+2]=D[o+2]+(b-D[o+2])*al;D[o+3]=255;}
  };
  for(let k=0;k<D.length;k+=4){D[k]=255;D[k+1]=255;D[k+2]=255;D[k+3]=255;}
  for(const i of order){
    const cx=Math.round(px(xv[i])*dpr),cy=Math.round(py(yv[i])*dpr);
    if(cx<M.l*dpr||cy>(H-M.b)*dpr||cx>=iw||cy<0)continue;
    let r,gg,b,a=0.75,pointRad=rad;
    if(vals){const t=Math.max(0,Math.min(1,(vals[i]-vlo)/((vhi-vlo)||1)));
      r=Math.round(30+225*t);gg=Math.round(60*(1-t)+40*t);b=Math.round(235-205*t);}
    else if(lab){const c=lab[i];
      if(c<0){r=gg=b=195;a=.5;}
      else{const h=PAL[c%PAL.length];r=parseInt(h.slice(1,3),16);gg=parseInt(h.slice(3,5),16);b=parseInt(h.slice(5,7),16);}}
    else{const d=gx[by(yv[i])*GB+bx(xv[i])];
      const t=Math.min(1,Math.sqrt(d/(dmax||1)));
      const u=t*(DENS.length-1),j=Math.min(DENS.length-2,Math.floor(u)),f=u-j;
      r=Math.round(DENS[j][0]+(DENS[j+1][0]-DENS[j][0])*f);
      gg=Math.round(DENS[j][1]+(DENS[j+1][1]-DENS[j][1])*f);
      b=Math.round(DENS[j][2]+(DENS[j+1][2]-DENS[j][2])*f);a=.9;}
    if(el('showSelection').checked&&(S.highlight||S.gateHighlight)){const h=!!S.highlight?.[i],gt=!!S.gateHighlight?.[i];
      if(h||gt)pointRad=Math.max(rad,Math.round(2*dpr));
      if(h&&gt){r=20;gg=150;b=75;a=1;}else if(h){r=235;gg=135;b=20;a=.95;}
      else if(gt){r=30;gg=100;b=230;a=.95;}else{r=gg=b=190;a=.22;}}
    put(cx,cy,r,gg,b,a,pointRad);
  }
  g.putImageData(img,0,0);

  // ---- axes ----
  g.strokeStyle="#333";g.lineWidth=1;g.beginPath();
  g.moveTo(M.l,M.t);g.lineTo(M.l,H-M.b);g.lineTo(W-M.r,H-M.b);g.stroke();
  g.fillStyle="#1b1f24";g.font="11px -apple-system,Segoe UI,Helvetica,Arial";
  g.textAlign="center";
  for(let k=0;k<=4;k++){const v=x0+(x1-x0)*k/4,X=px(v);
    g.beginPath();g.moveTo(X,H-M.b);g.lineTo(X,H-M.b+4);g.stroke();
    g.fillText(fmt(v),X,H-M.b+16);}
  g.textAlign="right";
  for(let k=0;k<=4;k++){const v=y0+(y1-y0)*k/4,Y=py(v);
    g.beginPath();g.moveTo(M.l,Y);g.lineTo(M.l-4,Y);g.stroke();
    g.fillText(fmt(v),M.l-7,Y+3);}
  g.textAlign="center";g.font="12px -apple-system,Segoe UI,Helvetica,Arial";
  g.fillText(xlab,M.l+(W-M.l-M.r)/2,H-6);
  g.save();g.translate(14,M.t+(H-M.t-M.b)/2);g.rotate(-Math.PI/2);g.fillText(ylab,0,0);g.restore();

  el("axhint").textContent=(S.active?("showing "+(S.active.view?S.active.view.path:"all events")
      +" · gate "+S.active.node.name+"  ·  "):"")
    +idx.length.toLocaleString()+" of "+N.toLocaleString()+" shown"
    +(S.tool!=="none"?"  ·  drag to draw a "+S.tool+" gate":"  ·  choose a gate tool, or click a population at left");
  const meta=mode==='embedding'?sp.embeddings[el('emb').value]:null;
  el('axhint').textContent+=' · '+(mode==='embedding'?(meta?.method||'Existing embedding'):(sp.feature_scale||'Measured flow; logicle display'));
  if(meta?.source_label)el('axhint').textContent+=' · '+meta.source_label;
  if(meta?.independent_of_labels===false)el('axhint').textContent+=' · Label-conditioned placement; not independent validation';
  overlay();legend();
}
function fmt(v){const a=Math.abs(v);
  return a>=1e5?v.toExponential(1):(a>=100?v.toFixed(0):(a>=1?v.toFixed(1):v.toFixed(2)));}

/* ---- gate outlines + the drawn gate, on the transparent overlay canvas ------------- */
function overlay(){
  const ov=el("ov"),dpr=window.devicePixelRatio||1,t=S.tf;if(!t)return;
  const g=ov.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,t.W,t.H);
  if(t.mode==="biaxial"){
    for(const [name,gs] of Object.entries(S.gatesets)){
      if((gs.space||"flow")!==S.space)continue;

}
function gatePoints(nd){

const ov=()=>el("ov");
function toData(ev){const r=ov().getBoundingClientRect();

document.addEventListener("mousedown",e=>{
  if(e.target!==ov()||S.tool==="none"||!S.tf)return;
  const p=toData(e);
  if(S.tool==="poly"){S.poly=S.poly&&S.poly._open?S.poly:Object.assign([],{_open:true});
    S.poly.push(p);S.poly._open=true;overlay();return;}
  S.drag=p;S.poly=null;});
document.addEventListener("mousemove",e=>{
  if(!S.drag||!S.tf)return;const p=toData(e);S.poly=shape(S.drag,p);overlay();});
document.addEventListener("mouseup",e=>{
  if(!S.drag||!S.tf)return;const p=toData(e);S.poly=shape(S.drag,p);S.drag=null;overlay();apply();});
document.addEventListener("dblclick",e=>{

function shape(a,b){
  if(S.tool==="rect"||S.tool==="quad"){
    if(S.tool==="quad")return quad(a);
    return [[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]];}
  if(S.tool==="ellipse"){const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,rx=Math.abs(b[0]-a[0])/2,ry=Math.abs(b[1]-a[1])/2;
    const out=[];for(let k=0;k<48;k++){const t=2*Math.PI*k/48;out.push([cx+rx*Math.cos(t),cy+ry*Math.sin(t)]);}return out;}
  return [[a[0],a[1]],[b[0],a[1]],[b[0],b[1]],[a[0],b[1]]];
}
function quad(a){ // upper-right quadrant from the click point, FlowJo's quadrant tool
  return [[a[0],a[1]],[S.tf.x1,a[1]],[S.tf.x1,S.tf.y1],[a[0],S.tf.y1]];}
async function apply(){

}
function pickLabelSets(){

}
async function editThreshold(j,value){const v=Number(value);if(!Number.isFinite(v))return;S.optimization.edited=true;S.optimization.candidates[S.optimization.selected||0].conditions[j].threshold=v;await showCandidate(S.optimization.selected||0);}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportStrategy(){const r=S.optimization;download(new Blob([JSON.stringify({...r,selected_strategy:r.candidates[r.selected||0]},null,2)],{type:'application/json'}),'flow_gate.json');}
async function exportEvents(){try{const r=S.optimization,c=r.candidates[r.selected||0];const response=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({space:'flow',label_set:r.label_set,conditions:c.conditions})});if(!response.ok)throw Error(await response.text());download(await response.blob(),'gated_events.tsv');}catch(e){showTargetError(e);}}

window.S=S;   // the render check reads gate sets off this
boot().catch(e=>{el('right').textContent=e.message;});
</script>
