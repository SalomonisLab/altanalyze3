<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>scALABLE - AltAnalyze3 single-cell viewer</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header id="topbar">
  <div class="brand">scALABLE</div>
  <label class="fld">Dataset
    <select id="dataset"></select>
  </label>
  <span id="dsinfo" class="muted"></span>
  <span class="spacer"></span>
  <span id="status" class="muted"></span>
</header>

<nav id="tabs">
  <button class="tab active" data-tab="embed">Embedding</button>
  <button class="tab" data-tab="expr">Expression</button>
  <button class="tab" data-tab="heat">Marker heatmap</button>
  <button class="tab" data-tab="deg">Differential</button>
  <button class="tab" data-tab="ccc">Cell-cell communication</button>
  <button class="tab" data-tab="about">Provenance</button>
</nav>

<main>
  <!-- ------------------------------------------------------------ Embedding -->
  <section id="panel-embed" class="panel active">
    <aside class="side">
      <label class="fld">Colour by
        <select id="colorby"></select>
      </label>
      <label class="fld">Gene overlay
        <input id="geneInput" type="text" placeholder="e.g. SFTPC" autocomplete="off" />
      </label>
      <div id="geneSuggest" class="suggest"></div>
      <label class="fld">Point size
        <input id="ptSize" type="range" min="1" max="6" step="0.5" value="2" />
      </label>
      <button id="clearOverlay" class="btn">Clear gene overlay</button>
      <div id="legend" class="legend"></div>
    </aside>
    <div class="plotwrap">
      <canvas id="umap"></canvas>
      <div id="umapNote" class="note"></div>
    </div>
  </section>

  <!-- ----------------------------------------------------------- Expression -->
  <section id="panel-expr" class="panel">
    <aside class="side">
      <label class="fld">Genes (comma separated)
        <input id="dotGenes" type="text" placeholder="SFTPC,SCGB1A1,COL1A1" />
      </label>
      <label class="chk"><input id="dotScale" type="checkbox" checked />
        colour each gene by its own max</label>
      <button id="dotGo" class="btn">Dot plot</button>
      <hr />
      <label class="fld">Violin gene
        <input id="violinGene" type="text" placeholder="SFTPC" />
      </label>
      <button id="violinGo" class="btn">Violin per cell state</button>
      <div id="exprInfo" class="note"></div>
    </aside>
    <div class="plotwrap scroll">
      <div id="violin"></div>
      <div id="dotplot"></div>
    </div>
  </section>

  <!-- -------------------------------------------------------- Marker heatmap -->
  <section id="panel-heat" class="panel">
    <aside class="side">
      <label class="fld">Markers per cell state
        <input id="heatTop" type="number" min="1" max="50" value="5" />
      </label>
      <label class="fld">Colour scheme
        <select id="heatScheme">
          <option value="altanalyze">cyan - black - yellow</option>
          <option value="cyan_yellow">cyan - yellow</option>
        </select>
      </label>
      <label class="chk"><input id="heatScale" type="checkbox" checked /> row z-score</label>
      <button id="heatGo" class="btn">Load Morpheus heatmap</button>
      <a id="heatTsv" class="btn ghost" target="_blank">Download TSV</a>
      <div id="heatInfo" class="note"></div>
    </aside>
    <div class="plotwrap">
      <iframe id="morpheus" title="Morpheus heatmap"></iframe>
    </div>
  </section>

  <!-- ------------------------------------------------------------- Differential -->
  <section id="panel-deg" class="panel">
    <aside class="side">
      <label class="fld">Comparison
        <select id="degSelect"></select>
      </label>
      <label class="fld">FDR &le;
        <input id="degFdr" type="number" step="0.01" min="0" max="1" value="0.05" />
      </label>
      <label class="fld">Cell state
        <select id="degState"><option value="">(all)</option></select>
      </label>
      <button id="degGo" class="btn">Load</button>
      <div id="degInfo" class="note"></div>
    </aside>
    <div class="plotwrap scroll">
      <canvas id="volcano"></canvas>
      <div id="degTable"></div>
    </div>
  </section>

  <!-- ----------------------------------------------------------------- CCC -->
  <section id="panel-ccc" class="panel">
    <div class="plotwrap scroll"><div id="cccBody"></div></div>
  </section>

  <!-- ---------------------------------------------------------- Provenance -->
  <section id="panel-about" class="panel">
    <div class="plotwrap scroll"><div id="aboutBody"></div></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
