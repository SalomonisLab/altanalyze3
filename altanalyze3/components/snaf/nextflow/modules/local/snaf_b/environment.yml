name: snaf_b
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip
  - pip:
      # Current GitHub build (the PyPI release lags the SNAF refactor).
      - git+https://github.com/SalomonisLab/altanalyze3.git
      # Surface/B-antigen pure-python deps (no TMHMM binary, no EMBOSS REST):
      - tmhmm.py     # pure-python transmembrane topology
      - biopython    # pure-python global alignment (replaces EMBOSS-needle)
      - mygene       # gene-symbol lookup (optional; degrades gracefully if absent)
