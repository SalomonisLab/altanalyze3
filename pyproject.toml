[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AltAnalyze3"
version = "0.1.2"
description = "AltAnalyze3: Advanced RNA-Seq Analysis Workflow"
authors = [{ name = "AltAnalyze", email = "altanalyze@gmail.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "aiofiles==24.1.0",
    "anndata==0.10.9",
    "Bio==1.7.1",
    "biopython>=1.84",
    "future==1.0.0",
    "h5py==3.10.0",
    "joblib==1.3.2",
    "matplotlib==3.6.2",
    "nimfa==1.4.0",
    "numpy==1.23.5",
    "pandas==1.5.2",
    "pysam==0.22.0",
    "pytest==8.3.3",
    "requests==2.32.3",
    "scanpy==1.10.3",
    "scikit-learn==1.3.2",
    "scipy==1.14.1",
    "seaborn==0.13.2",
    "lifelines==0.30.0",
    "setuptools==68.2.2",
    "statsmodels==0.14.0",
    "tqdm==4.62.3"
]

[project.optional-dependencies]
# SNAF neoantigen workflow extras (all cross-platform; import lazily so the core
# package never requires them):
#   snaf-bayes   -> BayesTS tumor-specificity (torch + pyro), and MHCflurry binding
#   snaf-immuno  -> deepimmuno immunogenicity prediction (tensorflow)
#   snaf         -> everything above
snaf-bayes = ["torch>=1.13", "pyro-ppl>=1.8.4", "mhcflurry>=2.0", "xmltodict>=0.13"]
snaf-immuno = ["tensorflow>=2.10"]
#   snaf-surface -> B-antigen surface pipeline: pure-python transmembrane topology
#                   (tmhmm.py) + gene-symbol lookup (mygene). Biopython is already core.
snaf-surface = ["tmhmm.py>=1.3", "mygene>=3.2"]
snaf = ["torch>=1.13", "pyro-ppl>=1.8.4", "mhcflurry>=2.0", "xmltodict>=0.13", "tensorflow>=2.10", "tmhmm.py>=1.3", "mygene>=3.2"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"altanalyze3.components.fastCNV" = ["resources/*.tsv"]
"altanalyze3.components.fastComm" = ["resources/*.tsv", "configs/*.json"]
"altanalyze3.components.long_read" = ["resources/*.gz"]
"altanalyze3.components.snaf" = ["nextflow/*.nf", "nextflow/*.config", "nextflow/conf/*", "nextflow/assets/*", "nextflow/modules/local/*/*"]
